repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        # SQLAlchemy 2.x ships inline type hints. Without it installed
        # here, the isolated hook environment resolves every ORM import
        # to Any and reports `no-any-return` at each call site — errors
        # that do not exist in the repo-wide run and would otherwise be
        # papered over with casts. Pinned to the versions in uv.lock so
        # the hook's view of the ORM cannot drift from the one the code
        # actually runs against; bump both together.
        additional_dependencies: [pydantic==2.12.5, sqlalchemy==2.0.53]
        args: [--config-file=pyproject.toml]
        exclude: '^\.(claude|tabnine)/.*/extractor_ground_truth\.py$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: debug-statements

  - repo: local
    hooks:
      - id: snapshot-regression
        name: snapshot regression tests
        entry: uv run --group test pytest tests/ -x -q
        language: system
        pass_filenames: false
        files: '^(src/vacantes/(extraction|domain)/.*|tests/.*)$'
