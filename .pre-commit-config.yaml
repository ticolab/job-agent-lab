repos:
  # Ruff and mypy run from the project environment rather than from
  # pre-commit's own isolated copies, so their versions come from uv.lock —
  # the same ones CI and the documented commands use. Pinning them here as
  # well let the two drift apart, and mypy's isolated environment saw a
  # different set of installed packages than the repo-wide run did.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # Checks the whole ``files`` set from pyproject.toml rather than the
        # staged files, so a green ``uv run mypy`` and a passing hook are the
        # same statement.
        entry: uv run --extra dev mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: debug-statements

  - repo: local
    hooks:
      - id: snapshot-regression
        name: snapshot regression tests
        entry: uv run --group test pytest tests/ -x -q
        language: system
        pass_filenames: false
        # Every package under src/, not just the matcher's: cli/, batch/
        # and persistence/ are exercised only by this suite, and a
        # migration that drifts from models.py is caught only here too.
        files: '^(src/job_discovery/.*|migrations/.*|tests/.*)$'
